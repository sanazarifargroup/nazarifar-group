<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="پیش‌نمایش ماشین‌آلات سفارشی گروه نظری‌فر" />
    <title>ماشین‌آلات سفارشی — گروه نظری‌فر</title>
    <link rel="stylesheet" href="../../architecture/design/design.css?v=22" />
  </head>
  <body data-language="fa" data-preview="machines">
    <header class="hero">
      <div class="topbar">
        <a class="brand" href="/custom-machines/" aria-label="بازگشت به ماشین‌آلات سفارشی">
          <span class="brand__frame"><img src="../../assets/na-logo-transparent.png" alt="NA" /></span>
          <span class="brand__name" data-copy="brand">Nazarifar Group</span>
        </a>
        <button class="language" type="button" data-language>EN</button>
      </div>

      <div class="carousel" aria-label="انتخاب دستگاه" data-carousel tabindex="0">
        <h1 class="carousel__title" data-copy="title">ماشین‌آلات سفارشی</h1>
        <div class="carousel__display">
          <button class="arrow arrow--previous" type="button" data-previous aria-label="دستگاه قبلی">&#8592;</button>
          <div class="number-window">
            <div class="carousel__track" data-track>
              <button class="slide" type="button" data-index="0">۱</button>
              <button class="slide" type="button" data-index="1">۲</button>
              <button class="slide" type="button" data-index="2">۳</button>
              <button class="slide" type="button" data-index="3">۴</button>
            </div>
          </div>
          <button class="arrow arrow--next" type="button" data-next aria-label="دستگاه بعدی">&#8594;</button>
        </div>
      </div>
    </header>

    <main class="viewer" aria-live="polite" data-viewer tabindex="0">
      <img class="project-image" src="../../assets/hero-renovation-ai-v5.png" alt="تصویر دستگاه" data-gallery-image fetchpriority="high" />
      <button class="viewer__arrow viewer__arrow--previous" type="button" data-image-previous aria-label="تصویر قبلی">&#8592;</button>
      <button class="viewer__arrow viewer__arrow--next" type="button" data-image-next aria-label="تصویر بعدی">&#8594;</button>
      <span class="viewer__image-count" data-image-count>۱ / ۳</span>
      <nav class="viewer__navigation" aria-label="ناوبری اصلی">
        <span class="viewer__item-name" data-item-name>دستگاه بازیافت آمالگام</span>
        <a href="/architecture/" data-navigation="architecture">معماری</a>
        <a href="/supply/" data-navigation="supply">تأمین و عرضه</a>
        <a href="/services/" data-navigation="services">خدمات</a>
        <a class="is-active" href="/custom-machines/" data-navigation="custom-machines">ماشین‌آلات سفارشی</a>
        <a href="/about/" data-navigation="about">درباره ما</a>
        <a href="/contact/" data-navigation="contact">تماس</a>
      </nav>
    </main>
    <script src="../../architecture/design/design.js?v=12"></script>
  </body>
</html>
