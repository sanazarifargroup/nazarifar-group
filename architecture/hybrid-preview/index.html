<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0907" />
    <title>پیش‌نمایش سیاه و سفید — گروه نظری‌فر</title>
    <link rel="stylesheet" href="hybrid.css?v=1" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="/architecture/">

        <span>Nazarifar Group</span>
      </a>
      <button type="button">EN</button>

    <main>
      <section class="hero">
        <img src="../../assets/architecture-desktop.webp" alt="" />
        <div class="hero__shade"></div>
        <div class="hero__copy">
          <p>گروه نظری‌فر</p>
          <h1>معماری</h1>
          <span>طراحی، دکوراسیون، بازسازی و تجهیز، سازه‌های چوبی و هوشمندسازی</span>
        </div>
        <a class="scroll" href="#archive">مشاهدهٔ پروژه‌ها <i></i></a>

      <section class="archive" id="archive">
        <header class="archive__header">
          <div>
            <p>آرشیو تصویری</p>
            <h2>پروژه‌های منتخب</h2>
          </div>
          <nav>

            <a href="#">مسکونی</a>
            <a href="#">اداری</a>
          </nav>
        </header>

        <div class="grid">
          <a class="project project--wide" href="/architecture/renovation/project/?id=residential-01">
            <span class="project__number">۰۱</span>
            <img src="../../assets/hero-renovation-ai-v5.png" alt="" />
          </a>
          <a class="project" href="/architecture/renovation/project/?id=residential-02">
            <span class="project__number">۰۲</span>
            <img src="../../assets/hero-renovation-ai-v3.png" alt="" />
          </a>
          <a class="project" href="/architecture/renovation/project/?id=office-01">
            <span class="project__number">۰۳</span>
            <img src="../../assets/hero-renovation-ai-v4.png" alt="" />
          </a>
        </div>
      </section>
    </main>

    <footer><span>NA / 2026</span><span>گروه نظری‌فر</span></footer>

</html>
