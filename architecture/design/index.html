<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="پروژه‌های طراحی و دکوراسیون داخلی گروه نظری‌فر" />
    <title>طراحی — گروه نظری‌فر</title>
    <link rel="stylesheet" href="design.css?v=23" />
  </head>
  <body data-language="fa">
    <header class="hero">
      <div class="topbar">
        <a class="brand" href="/architecture/" aria-label="بازگشت به طراحی و دکوراسیون داخلی">
          <span class="brand__frame"><img src="../../assets/na-logo-transparent.png" alt="NA" /></span>
          <span class="brand__name" data-copy="brand">Nazarifar Group</span>
        </a>
        <button class="language" type="button" data-language>EN</button>
      </div>

      <div class="carousel" aria-label="انتخاب پروژه" data-carousel tabindex="0">
        <h1 class="carousel__title" data-copy="title">طراحی</h1>
        <div class="carousel__display">
          <button class="arrow arrow--previous" type="button" data-previous aria-label="پروژه قبلی">&#8592;</button>
          <div class="number-window">
            <div class="carousel__track" data-track>
              <button class="slide" type="button" data-index="0">۱</button>
            </div>
          </div>
          <button class="arrow arrow--next" type="button" data-next aria-label="پروژه بعدی">&#8594;</button>
        </div>
      </div>
    </header>

    <main class="viewer" aria-live="polite" data-viewer tabindex="0">
      <img class="project-image" src="../../assets/projects/پزشکان/01.jpg" alt="تصویر ۱ از پروژه طراحی ۱" data-gallery-image fetchpriority="high" />
      <button class="viewer__arrow viewer__arrow--previous" type="button" data-image-previous aria-label="تصویر قبلی">&#8592;</button>
      <button class="viewer__arrow viewer__arrow--next" type="button" data-image-next aria-label="تصویر بعدی">&#8594;</button>
      <span class="viewer__image-count" data-image-count>۱ / ۳</span>
      <nav class="viewer__navigation" aria-label="ناوبری اصلی">
        <a class="is-active" href="/architecture/" data-navigation="architecture">طراحی و دکوراسیون داخلی</a>
        <a href="/supply/" data-navigation="supply">تأمین و عرضه</a>
        <a href="/services/" data-navigation="services">خدمات</a>
        <a href="/custom-machines/" data-navigation="custom-machines">ماشین‌آلات سفارشی</a>
        <a href="/about/" data-navigation="about">درباره ما</a>
        <a href="/contact/" data-navigation="contact">تماس</a>
      </nav>
    </main>
    <script src="design.js?v=13"></script>
  </body>
</html>
