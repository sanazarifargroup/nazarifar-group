<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090706" />
    <meta
      name="description"
      content="Nazarifar Group — Architecture, Supply, Services and Custom Machines."
    />
    <title>Nazarifar Group</title>
    <link
      rel="preload"
      as="image"
      href="assets/hero-cinematic-desktop.webp"
      media="(min-width: 701px)"
    />
    <link
      rel="preload"
      as="image"
      href="assets/hero-cinematic-mobile.webp"
      media="(max-width: 700px)"
    />
    <link rel="stylesheet" href="style.css?v=20260728-8" />
  </head>
  <body>
    <main class="site" aria-live="polite">
      <section class="scene is-active" id="holding" data-scene="holding" aria-hidden="false">
        <picture class="scene__picture">
          <source media="(max-width: 700px)" srcset="assets/hero-cinematic-mobile.webp" />
          <img
            src="assets/hero-cinematic-desktop.webp"
            alt=""
            fetchpriority="high"
            decoding="async"
          />
        </picture>
        <div class="scene__shade scene__shade--holding"></div>
      </section>

      <section class="scene" id="architecture" data-scene="architecture" aria-hidden="true">
        <picture class="scene__picture">
          <source media="(max-width: 700px)" srcset="assets/architecture-mobile.webp" />
          <img src="assets/architecture-desktop.webp" alt="" loading="lazy" decoding="async" />
        </picture>
        <div class="scene__shade"></div>
        <div class="section-copy" data-copy="architecture"></div>
      </section>

      <section class="scene" id="supply" data-scene="supply" aria-hidden="true">
        <picture class="scene__picture">
          <source media="(max-width: 700px)" srcset="assets/supply-mobile.webp" />
          <img src="assets/supply-desktop.webp" alt="" loading="lazy" decoding="async" />
        </picture>
        <div class="scene__shade"></div>
        <div class="section-copy section-copy--supply" data-copy="supply"></div>
      </section>

      <section class="scene" id="services" data-scene="services" aria-hidden="true">
        <picture class="scene__picture">
          <source media="(max-width: 700px)" srcset="assets/services-mobile.webp" />
          <img src="assets/services-desktop.webp" alt="" loading="lazy" decoding="async" />
        </picture>
        <div class="scene__shade"></div>
        <div class="section-copy section-copy--services" data-copy="services"></div>
      </section>

      <section
        class="scene scene--custom-machines"
        id="custom-machines"
        data-scene="custom-machines"
        aria-hidden="true"
      >
        <picture class="scene__picture scene__picture--custom-machines">
          <img
            data-image-source="assets/custom-machines-approved.b64"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </picture>
        <div class="scene__shade scene__shade--machine"></div>
        <div
          class="section-copy section-copy--custom-machines"
          data-copy="custom-machines"
        ></div>
      </section>

      <section class="scene scene--about" id="about" data-scene="about" aria-hidden="true">
        <picture class="scene__picture scene__picture--about">
          <img
            data-image-source="assets/about-approved.b64"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </picture>
        <div class="scene__shade scene__shade--about"></div>
        <div class="section-copy section-copy--about" data-copy="about"></div>
      </section>

      <section class="scene scene--contact" id="contact" data-scene="contact" aria-hidden="true">
        <picture class="scene__picture scene__picture--contact">
          <img
            data-image-source="assets/contact-approved.b64"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </picture>
        <div class="scene__shade scene__shade--contact"></div>
        <div class="section-copy section-copy--contact" data-copy="contact"></div>
      </section>

      <a class="brand" href="#holding" aria-label="Nazarifar Group home">
        <span class="brand__mark-frame">
          <img class="brand__mark" src="assets/na-logo-transparent.png" alt="NA" />
        </span>
        <span class="brand__name">Nazarifar Group</span>
      </a>

      <nav class="navigation" aria-label="Main navigation">
        <button type="button" data-target="architecture"></button>
        <button type="button" data-target="supply"></button>
        <button type="button" data-target="services"></button>
        <button type="button" data-target="custom-machines"></button>
        <button type="button" data-target="about"></button>
        <button type="button" data-target="contact"></button>
        <button class="language" type="button" data-language>FA</button>
      </nav>
    </main>
    <script src="script.js?v=20260728-10"></script>
  </body>
</html>
